<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.plot.ly/plotly-3.4.0.min.js" charset="utf-8"></script>
    <script type="module" src="js/index.js"></script>
    <title>JLX11</title>
</head>

<body>
    <main>
        <h1>Hello World!</h1>
        <table id="productInfo">
            <thead>
                <tr>
                    <th>Property</th>
                    <th>Value</th>
                </tr>
            </thead>
            <tr>
                <td>Vendor</td>
                <td id="vendor">Loading...</td>
            </tr>
            <tr>
                <td>Plugin Name</td>
                <td id="pluginName">Loading...</td>
            </tr>
            <tr>
                <td>Plugin Version</td>
                <td id="pluginVersion">Loading...</td>
            </tr>
        </table>
        <button id="nativeFunctionButton">Call native function</button>
        <button id="emitEventButton">Emit a front end event</button>
        <br>
        <input type="range" id="outputLevelSlider">
        <br>

        <div id="outputLevelPlot"></div>
    </main>
</body>

</html>
