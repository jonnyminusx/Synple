name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libasound2-dev \
            libgl-dev \
            libcurl4-openssl-dev \
            libgtk-3-dev \
            libxrandr-dev \
            libwebkit2gtk-4.1-dev \
            clang-format \
            clang-tidy \
            iwyu

      - name: Cache CPM and JUCE
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build/cmake
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            juce-${{ runner.os }}-

      - name: Install Node dependencies
        run: cd source/ui && npm ci

      - name: Check formatting
        run: |
          clang-format --dry-run --Werror \
            $(find source/juce source/midi source/synth source/math -name '*.cpp' -o -name '*.h')

      - name: Configure
        run: cmake -B build

      - name: Check tidy
        run: |
          clang-tidy -p build \
            $(find source/midi source/synth source/math -name '*.cpp')

      - name: Check IWYU
        run: |
          iwyu_tool -p build \
            $(find source/midi source/synth source/math -name '*.cpp')

      - name: Build
        run: cmake --build build --parallel

  sanitizers:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Cache CPM and Catch2
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build/cmake
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -DBUILD_PLUGIN=OFF -DENABLE_SANITIZERS=ON

      - name: Build and run tests
        run: cmake --build build
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
